
spring.config.import=optional:classpath:db.properties

spring.datasource.url=${DB_URL:${db.url}}
spring.datasource.username=${DB_USERNAME:${db.username}}
spring.datasource.password=${DB_PASSWORD:${CANTEEN_DB_PASSWORD:${db.password}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.thymeleaf.cache=false

server.port=${PORT:8080}
