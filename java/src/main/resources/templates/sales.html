
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Analysis Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
            color: #333;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #263b5e;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .summary {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            flex: 1;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            text-align: center;
        }

        .card h3 {
            color: #666;
            margin-top: 0;
        }

        .value {
            font-size: 30px;
            font-weight: bold;
            color: #167d55;
        }

        .chart {
            background: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            text-align: center;
        }

        .chart img {
            max-width: 100%;
            height: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 15px;
        }

        th, td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #263b5e;
            color: white;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #263b5e;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .summary {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Sales Analysis Dashboard</h1>
    <p class="subtitle">Canteen Ordering and Sales Analysis System</p>

    <div class="summary">
        <div class="card">
            <h3>Total Completed Orders</h3>
            <div class="value" th:text="${totalOrders}">0</div>
        </div>

        <div class="card">
            <h3>Total Revenue</h3>
            <div class="value">
                ₹<span th:text="${#numbers.formatDecimal(totalRevenue, 1, 2)}">0.00</span>
            </div>
        </div>
    </div>

    <div class="chart">
        <h2>Item-wise Sales</h2>
        <img src="/charts/item_wise_sales.png"
             alt="Item-wise Sales Chart">
    </div>

    <div class="chart">
        <h2>Daily Revenue</h2>
        <img src="/charts/daily_revenue.png"
             alt="Daily Revenue Chart">
    </div>

    <div class="chart">
        <h2>Popular Food Items</h2>
        <img src="/charts/popular_food_items.png"
             alt="Popular Food Items Chart">
    </div>

    <div class="chart">
        <h2>Food Item Sales Details</h2>

        <table>
            <thead>
                <tr>
                    <th>Food Item</th>
                    <th>Quantity Sold</th>
                    <th>Revenue (₹)</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="item : ${itemSales}">
                    <td th:text="${item.item_name}"></td>
                    <td th:text="${item.quantity_sold}"></td>
                    <td th:text="${#numbers.formatDecimal(item.revenue, 1, 2)}"></td>
                </tr>

                <tr th:if="${#lists.isEmpty(itemSales)}">
                    <td colspan="3">No sales recorded yet.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <a href="/" class="back">Back to Home</a>

</div>
</body>
</html>
